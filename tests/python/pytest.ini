[pytest]
# Pytest configuration for TCT Python tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

# Minimum pytest version
minversion = 7.0

# Allow imports of helpers that live next to the tests.
pythonpath = .
