name: TCT CI

"on":
  # Automatic hosted runs are disabled: local validation is the source of
  # truth (./scripts/testing/local-ci.sh). Uncomment the triggers below to
  # run this job on GitHub-hosted runners.
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tct-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  TCT_GENERATED_CARGO_TARGET_DIR: ${{ github.workspace }}/target/tct-generated-cargo/ci-default-round-trip

jobs:
  stable:
    name: Stable Quality And Default Round Trips
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "${toolchain}" --profile minimal --component clippy --component rustfmt
          rustup default "${toolchain}"
          echo "RUSTUP_TOOLCHAIN=${toolchain}" >> "${GITHUB_ENV}"
          rustup show active-toolchain

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Stable quality helper
        run: ./scripts/testing/quality-check.sh

