[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# unbounded_depth: deeply nested instances and schemas can exceed serde_json's
# default recursion limit of 128; the compiler validates depth itself.
serde_json = { version = "1.0.149", features = ["preserve_order", "unbounded_depth"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
stringcase = "0.4.0"
syn = { version = "2.0.117", features = ["full"] }
prettyplease = "0.2.37"
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.3"
lazy_static = "1.5.0"
# Used by tests only: generated crates declare their own dependency (see
# src/generated_crate.rs). Kept a normal dependency so dev and normal builds share
# one serde_json feature set (as a dev-dependency, doctests see two serde_json
# builds and fail to compile). The default features would add an HTTP/TLS stack
# for fetching remote $refs, which TCT never does.
jsonschema = { version = "0.46.2", default-features = false }
rustc-hash = "2.1.2"  # FxHashMap for 2-3x faster non-cryptographic hashing
rayon = "1.12.0"  # Parallel iterators for BPE training speedup
ahash = "0.8.12"  # Fast non-cryptographic hashing for BPE training optimization
chrono = { version = "0.4.44", features = ["serde"] }  # Date formatting for BPE training
glob = "0.3.3"  # File pattern matching for BPE training
rand = "0.10.1"  # Random sampling for BPE training dataset selection
base64 = "0.22.1"  # Base64 encoding/decoding for byte format optimization
pyo3 = { version = "0.29.3", optional = true }  # Python bindings
sha2 = "0.11.0"  # SHA-256 provenance hashes for generated artifacts

[dev-dependencies]
tempfile = "3.27.0"
rand = "0.10.1"
quickcheck = "1.1.0"
proptest = "1.11.0"
arbitrary = { version = "1.4.2", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
expect-test = "1.5.1"
