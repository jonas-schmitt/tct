[package]
name = "tct"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
default-run = "tct"
license = "Apache-2.0"
authors = ["Jonas Schmitt"]
description = "Compile JSON Schemas into compact, schema-specific tokenizers whose output always has the schema's structure"
repository = "https://github.com/jonas-schmitt/tct"
readme = "README.md"
keywords = ["tokenizer", "json-schema", "llm", "bpe", "code-generation"]
categories = ["compilers", "encoding", "parser-implementations"]
exclude = [
    "/publication/",
    "schemas/bpe/*",
    "tests/data/*",
    "examples/*",
    "corpora/*",
    "reports/*",
    # Frontend test fixtures stay out of the package, except the files that the
    # experimental frontend modules embed with include_str!/include_bytes!.
    "tests/fixtures/*",
    "!tests/fixtures/go_ast_schema_inventory/go1.24.3-ast-schema-inventory-v1.json",
    "!tests/fixtures/go_syntax_corpus/src/concurrency_map_interface_type_assertion/main.go",
    "!tests/fixtures/go_syntax_corpus/src/crypto/internal/sysrand/rand_windows.go",
    "!tests/fixtures/go_syntax_corpus/src/crypto/subtle/xor.go",
    "!tests/fixtures/go_syntax_corpus/src/import_spec_comment/main.go",
    "!tests/fixtures/go_syntax_corpus/src/import_spec_name/main.go",
    "!tests/fixtures/go_syntax_corpus/src/local_generic_function/main.go",
    "!tests/fixtures/go_syntax_corpus/src/local_variadic_ellipsis/main.go",
    "!tests/fixtures/go_syntax_corpus/src/path/match.go",
    "!tests/fixtures/go_syntax_corpus/src/strings/search.go",
    "!tests/fixtures/go_syntax_corpus/src/type_spec_type_params/main.go",
    "!tests/fixtures/go_syntax_corpus/src/value_spec_comment/main.go",
    "!tests/fixtures/sql_schema_linking/qualified_menu/tables.json",
    "!tests/fixtures/syntax_backend/generated-artifact-envelope-v1.json",
    "!tests/fixtures/syntax_backend/generated-artifact-replay-v1.json",
    "!tests/fixtures/syntax_backend/input-validation-diagnostics-v1.json",
    "!tests/fixtures/syntax_backend/input-validation-negative-fixtures-v1.json",
    "!tests/fixtures/syntax_backend/production-boundary-contract-v1.json",
    "!tests/fixtures/syntax_backend/validation-hook-contract-v1.json",
    "!tests/fixtures/syntax_backend/validation-hook-sidecar-evidence-v1.json",
]

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
extended-benchmarks = []
comprehensive-tests = []
round-trip-tests = []
python = ["pyo3"]
python-extension = ["python", "pyo3/extension-module"]
# Experimental non-JSON frontends (SQL schema linking, syntax layer with Go and
# C# targets, tree-sitter subset codecs, exact-mask contract), their binaries,
# and their integration tests. No stability guarantees.
experimental = []

# Experimental frontend binaries: built only with `--features experimental`.
[[bin]]
name = "tct-sql-band-mixing-census"
path = "src/bin/tct-sql-band-mixing-census.rs"
required-features = ["experimental"]

[[bin]]
name = "tct-sql-elided-bpe-encode-corpus"
path = "src/bin/tct-sql-elided-bpe-encode-corpus.rs"
required-features = ["experimental"]

[[bin]]
name = "tct-sql-elided-bpe-validate"
path = "src/bin/tct-sql-elided-bpe-validate.rs"
required-features = ["experimental"]

[[bin]]
name = "tct-sql-elided-encode-corpus"
path = "src/bin/tct-sql-elided-encode-corpus.rs"
required-features = ["experimental"]

[[bin]]
name = "tct-sql-shared-pool-corpus-gate"
path = "src/bin/tct-sql-shared-pool-corpus-gate.rs"
required-features = ["experimental"]

[[bin]]
name = "tct-syntax-go-tokenizer-generator"
path = "src/bin/tct-syntax-go-tokenizer-generator.rs"
required-features = ["experimental"]

[[bin]]
name = "tct-syntax-source-corpus-evidence"
path = "src/bin/tct-syntax-source-corpus-evidence.rs"
